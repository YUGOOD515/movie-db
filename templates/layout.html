<!DOCTYPE html>

<html lang="zh-CN" data-bs-theme="dark">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="initial-scale=1, width=device-width">
        <meta name="color-scheme" content="dark light">
        <link rel="icon" href="data:,">

        <!-- http://getbootstrap.com/docs/5.3/ -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
        <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
        <script>
            (() => {
                const savedTheme = localStorage.getItem("media-theme");
                document.documentElement.dataset.bsTheme = savedTheme || "dark";
            })();
        </script>

        <title>Media{% block title %}{% endblock %}</title>
    </head>
    <body>
        <button class="site-menu-toggle btn border-0 bg-transparent d-flex align-items-center justify-content-center p-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#site-sidebar" aria-controls="site-sidebar" aria-label="打开导航">
            <i class="bi bi-list" aria-hidden="true"></i>
        </button>

        <aside class="site-sidebar offcanvas offcanvas-start" tabindex="-1" id="site-sidebar" aria-label="主导航">
            <div class="offcanvas-header d-flex align-items-center justify-content-between">
                <a class="sidebar-brand text-decoration-none text-body m-0" href="{{ url_for('index') }}">
                    Media
                </a>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#site-sidebar" aria-label="关闭"></button>
            </div>
            <div class="offcanvas-body d-flex flex-column">
                <div class="sidebar-nav-group">
                    <div class="sidebar-section-label">浏览</div>
                    <nav class="nav nav-pills flex-column" aria-label="浏览导航">
                        <a class="nav-link" href="{{ url_for('index') }}">媒体库</a>
                        <a class="nav-link" href="{{ url_for('recent_added_library') }}">最近添加</a>
                        <a class="nav-link" href="{{ url_for('unwatched_library') }}">未观看</a>
                        <a class="nav-link" href="{{ url_for('top_rated_library') }}">最受好评</a>
                    </nav>
                </div>

                <div class="sidebar-nav-group">
                    <div class="sidebar-section-label">分类与收藏</div>
                    <nav class="nav nav-pills flex-column" aria-label="分类导航">
                        <a class="nav-link" href="{{ url_for('catalog') }}">类别筛选</a>
                        <a class="nav-link" href="{{ url_for('favorites_library') }}">收藏</a>
                    </nav>
                </div>

                <div class="sidebar-nav-group">
                    <div class="sidebar-section-label">管理</div>
                    <nav class="nav nav-pills flex-column" aria-label="管理导航">
                        <a class="nav-link" href="{{ url_for('media') }}">媒体资源管理</a>
                    </nav>
                </div>

                <div class="sidebar-footer mt-auto d-flex align-items-center">
                    <button class="sidebar-theme-toggle btn d-inline-flex align-items-center justify-content-center" id="theme-toggle" type="button" aria-label="切换明暗主题" title="切换外观主题">
                        <i class="bi bi-moon-stars-fill" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </aside>

        <main class="{% block main_class %}pt-5 mt-3 pb-5{% endblock %}">
            {% block main %}{% endblock %}
        </main>
        {% with messages = get_flashed_messages(with_categories=true) %}
            <div class="d-none" data-flash-messages>
                {% for category, message in messages %}
                    <span data-flash-toast data-category="{{ category }}">{{ message }}</span>
                {% endfor %}
            </div>
        {% endwith %}
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="{{ url_for('static', filename='site.js') }}"></script>
        {% block scripts %}{% endblock %}
    </body>
</html>
