<!DOCTYPE html>

<html lang="zh-CN" data-bs-theme="dark">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="initial-scale=1, width=device-width">
        <meta name="color-scheme" content="dark light">
        <link rel="icon" href="data:,">

        <!-- http://getbootstrap.com/docs/5.3/ -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
        <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
        <script>
            (() => {
                const savedTheme = localStorage.getItem("media-theme");
                document.documentElement.dataset.bsTheme = savedTheme || "dark";
            })();
        </script>

        <title>Media{% block title %}{% endblock %}</title>
    </head>
    <body class="site-body">
        <button class="site-menu-toggle" type="button" data-bs-toggle="offcanvas" data-bs-target="#site-sidebar" aria-controls="site-sidebar" aria-label="打开导航">
            <i class="bi bi-list" aria-hidden="true"></i>
        </button>

        <aside class="site-sidebar offcanvas offcanvas-start" tabindex="-1" id="site-sidebar" aria-label="主导航">
            <div class="offcanvas-header">
                <span class="offcanvas-title">导航</span>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#site-sidebar" aria-label="关闭"></button>
            </div>
            <div class="offcanvas-body">
                <a class="sidebar-brand" href="{{ url_for('index') }}">
                    <span class="brand-mark" aria-hidden="true"><i class="bi bi-play-fill"></i></span>
                    <span>Media</span>
                </a>

                <nav class="sidebar-nav nav nav-pills flex-column" aria-label="媒体库导航">
                    <a class="nav-link" href="{{ url_for('index') }}">
                        <i class="bi bi-collection-play" aria-hidden="true"></i>
                        <span>媒体库</span>
                    </a>
                    <a class="nav-link" href="{{ url_for('media') }}">
                        <i class="bi bi-link-45deg" aria-hidden="true"></i>
                        <span>资源关联</span>
                    </a>
                </nav>

                <div class="sidebar-footer">
                    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换明暗主题">
                        <i class="bi bi-sun" aria-hidden="true"></i>
                        <span>切换主题</span>
                    </button>
                </div>
            </div>
        </aside>

        <div class="site-content">
            <main class="{% block main_class %}container-xl page-main{% endblock %}">
                {% block main %}{% endblock %}
            </main>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="{{ url_for('static', filename='site.js') }}"></script>
        {% block scripts %}{% endblock %}
    </body>
</html>
