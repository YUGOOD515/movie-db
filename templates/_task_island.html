{# 后台任务：平时收成左上角菜单按钮旁的圆钮（有任务才出现），排队的任务叠成一串圆形海报，有事件时短暂展开成胶囊；
   点击后任务在圆钮下方排成一列胶囊卡片，点卡片原地展开当前进度。由 static/task-center.js 生成。 #}
<div class="task-center" data-task-center hidden
     data-status-url="{{ url_for('background_tasks') }}"
     data-jobs-url="{{ url_for('association_jobs') }}"
     data-scan-url="{{ url_for('discover_import_media') }}"
     data-rating-url="{{ url_for('refresh_manager_ratings') }}"
     data-image-base="{{ url_for('static', filename='') }}">
    <button type="button" class="task-orb" data-task-orb aria-expanded="false" aria-controls="task-island-list" hidden>
        <span class="orb-more" data-orb-more aria-hidden="true"></span>
        <span class="orb-stack" data-orb-stack aria-hidden="true"></span>
        <span class="island-ring" data-orb-ring aria-hidden="true"></span>
        <span class="orb-alert" aria-hidden="true"></span>
        <span class="orb-live" aria-hidden="true"><span class="island-title" data-orb-title></span><span class="island-caption" data-orb-caption></span></span>
    </button>
    <ul class="island-list" id="task-island-list" data-task-list aria-label="后台任务" hidden></ul>
</div>
