<div class="modal fade" id="title-deletion" tabindex="-1" aria-labelledby="title-deletion-heading">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content squircle-card">
            <div class="modal-header border-0">
                <h2 class="modal-title h5" id="title-deletion-heading">删除作品</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭" data-delete-dismiss></button>
            </div>
            <div class="modal-body" aria-busy="false" data-delete-body>
                <p class="small text-body-secondary mb-0" role="status" data-delete-status>正在检查数据库和本地图片…</p>
                <div class="d-none" data-delete-summary></div>
            </div>
            <div class="position-absolute bottom-0 end-0 d-flex flex-wrap justify-content-end gap-2 p-3 bg-transparent mw-100 z-1" data-delete-actions>

                <button type="button" class="btn btn-sm btn-outline-secondary d-none" data-delete-retry>重新检查</button>
                <button type="button" class="btn btn-sm btn-danger" data-delete-confirm disabled>确认删除</button>
            </div>
        </div>
    </div>
</div>
