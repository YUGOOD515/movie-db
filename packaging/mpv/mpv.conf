# MovieDB 内置 mpv 的配置。只有安装包自带的 mpv 使用这份配置，用户自己安装的 mpv 不受影响。
# 选项说明见 https://mpv.io/manual/stable/

# libplacebo 渲染：杜比视界、HDR10 的色彩映射都靠它。显示器开了 HDR 时自动输出 HDR（target-colorspace-hint 默认 auto）。
vo=gpu-next
# 能用显卡解码就用，遇到已知有问题的组合自动退回软件解码
hwdec=auto-safe

# 观看进度由 MovieDB 记录，不让 mpv 自己另存一份
save-position-on-quit=no
keep-open=no

# 优先中文字幕
slang=chi,zho,zh,chs,sc,zh-Hans,zh-CN
